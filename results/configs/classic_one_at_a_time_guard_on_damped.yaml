# Settings of every run: the solver settings of the Zeng/Chiang cases shipped
# with Sparlectra (data/scf/case14_zeng_p306_*.config.yaml), with every
# automatic machinery off (rescue, auto mode, damping, start projection,
# APSLF start, merit, trust region) and the outer control loop off: the tap
# changers, phase shifters and SVC of sp_case14 and sp_case60 keep the
# positions of the case file, so a run is one Newton solve with the Q-limit
# strategy alone. The strategy and the guard are set per run in
# run_compare.jl.
config_version: 1
control:
  enabled: false
power_flow:
  apslf_start:
    enabled: false
  autodamp: true
  dc:
    fallback: false
  distributed_slack:
    enabled: false
  external_grid:
    enabled: false
  linear_solver: umfpack_reuse
  max_iter: 80
  merit:
    enabled: false
    fallback_max_mismatch: false
  mode: manual
  qlimits:
    enabled: true
    enforcement_mode: classic_one_at_a_time
    guard:
      enabled: true
  rescue: false
  solver: rectangular
  start_current_iteration:
    enabled: false
  start_mode:
    angle_mode: classic
    start_projection: false
    dc_seed_unconditional: false
    voltage_mode: classic
  tol: 1.0e-6
  trust_region:
    enabled: false
  wrong_branch_detection: "off"
